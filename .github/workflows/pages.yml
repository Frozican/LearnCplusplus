name: Deploy Learn C++ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript modules
        run: |
          node --version
          for file in assets/js/app.js assets/js/auth.js assets/js/progress.js assets/js/supabase.js assets/js/data/curriculum.js; do
            node --input-type=module --check < "$file"
          done
          node --input-type=module -e "import('node:fs').then(fs => import('data:text/javascript,' + encodeURIComponent(fs.readFileSync('assets/js/data/curriculum.js', 'utf8')))).then(m => { if (m.lessons.length !== 200 || m.chapters.length !== 20) process.exit(1); console.log('Curriculum OK:', m.lessons.length, 'lessons'); })"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
