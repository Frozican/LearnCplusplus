*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#1a2c50 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#0c1323eF;padding:24px 17px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 25px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#6ca8ff,#7b73e8);display:grid;place-items:center;color:#081326;font-weight:900;font-size:19px;box-shadow:0 8px 24px #568bff40}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:var(--muted)}.nav-label{font-size:10px;letter-spacing:1.7px;color:#70819d;font-weight:800;padding:16px 10px 8px}.nav-btn{width:100%;border:0;background:transparent;color:#aebbd0;padding:10px 12px;border-radius:10px;text-align:left;display:flex;gap:10px;align-items:center;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:#1b2a45;color:white}.nav-btn.active{box-shadow:inset 3px 0 var(--blue)}.nav-btn .count{margin-left:auto;font-size:11px;color:#8294b0}.side-bottom{margin-top:26px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#111b2d}.side-bottom small{color:var(--muted)}.progress-track{height:6px;background:#263550;border-radius:9px;overflow:hidden;margin:9px 0}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .3s}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid #24324b;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,55px);position:sticky;top:0;z-index:5;background:#0b1120dc;backdrop-filter:blur(18px)}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;align-items: ckground:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);display:grid;place-items:center;font-size:22px;margin-bottom:14px}.pill{display:inline-flex;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);padding:3px 9px;border-radius:30px;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.course-card h3{font-size:20px;margin:10px 0 4px}.course-card p{color:var(--muted);margin:0 0 15px;font-size:13px}.course-meta{display:flex;gap:15px;color:#a7b6cc;font-size:12px;margin:14px 0}.btn{border:1px solid #3a5277;background:#213657;color:#eaf2ff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}.btn:hover{filter:brightness(1.15)}.btn.primary{background:linear-gradient(110deg,#4d83dc,#666bd0);border:0;color:white}.btn.ghost{background:transparent;border-color:var(--line);color:#b8c8df}.btn.small{padding:6px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:13px;background:#111a2b}.stat strong{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.lesson-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px}.lesson-list{border:1px solid var(--line);background:#10192a;border-radius:14px;padding:12px;height:max-content;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}.lesson-list h3{font-size:12px;color:#8fa3c1;letter-spacing:1px;text-transform:uppercase;padding:5px 9px}.lesson-link{display:flex;width:100%;text-align:left;border:0;background:transparent;color:#aebdd2;padding:9px;border-radius:8px;font-size:12px;gap:8px;align-items:center}.lesson-link:hover,.lesson-link.active{background:#1d2c47;color:white}.lesson-link .done{color:var(--green)}.lesson-article{min-width:0}.lesson-article h1{font-size:34px;line-height:1.2;letter-spacing:-1px;margin:8px 0}.lesson-article h2{font-size:21px;margin:30px 0 9px}.lesson-article p,.lesson-article li{color:#bdc9da}.lesson-article code:not(pre code){background:#1b2940;padding:2px 5px;border-radius:5px;color:#a9d5ff}.lesson-article pre{background:#080e19;border:1px solid #283953;border-radius:12px;padding:17px;overflow:auto;color:#d7e5ff;font:13px/1.7 ui-monospace,monospace}.callout{padding:14px 16px;border-left:3px solid var(--cyan);background:#142b32;border-radius:0 10px 10px 0;color:#ccebe5;margin:20px 0}.exercise{border:1px solid #354b6c;background:#121e32;border-radius:14px;padding:18px;margin:25px 0}.exercise h3{margin:0 0 8px}.exercise textarea{width:100%;min-height:100px;background:#080f1c;color:#d9e7ff;border:1px solid #314563;border-radius:9px;padding:12px;font:13px/1.6 ui-monospace,monospace;resize:vertical}.feedback{font-size:13px;margin-top:10px;color:var(--muted)}.quiz-option{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:8px 0;color:#c6d3e5;cursor:pointer}.quiz-option:has(input:checked){border-color:var(--blue);background:#1a2b47}.empty{padding:55px 20px;text-align:center;border:1px dashed #344765;border-radius:15px;color:var(--muted)}.lesson-footer{display:flex;justify-content:space-between;gap:12px;margin-top:35px;padding-top:20px;border-top:1px solid var(--line)}.hidden{display:none!important}.mobile-menu{display:none}.search-results{position:absolute;right:80px;top:60px;background:#15223a;border:1px solid var(--line);border-radius:10px;width:min(320px,80vw);padding:8px;box-shadow:var(--shadow);z-index:9}.search-result{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dce8fa;padding:9px;border-radius:7px}.search-result:hover{background:#263c60}

<script>
const lessons={
basic:[
{title:"Getting Started with C++",time:"8 min",desc:"Understand what C++ is, how a program is built, and how to run your first application.",sections:[["What is C++?","C++ is a general-purpose programming language used in game engines, desktop software, embedded systems and performance-critical applications. It gives you control over memory and hardware while supporting modern abstractions."],["Your first program","A C++ program starts executing in the main function. The iostream header provides tools for input and output."]],code:'#include <iostream>\n\nint main() {\n    std::cout << "Hello, world!\\n";\n    return 0;\n}',tip:"Compile with a modern compiler using -std=c++20 (or choose the standard supported by your toolchain).",quiz:{q:"Which function is the usual entry point of a C++ program?",opts:["start()","main()","run()"],a:1,why:"Execution of a standard hosted C++ program begins in main()."}},
{title:"Variables & Data Types",time:"12 min",desc:"Store information using variables and choose suitable types.",sections:[["Declaring variables","A variable is a named object that stores a value. Give it a type and a meaningful name. Prefer initialization when you declare a variable."],["Common types","Use int for whole numbers, double for floating-point values, bool for true/false and std::string for text. Include <string> to use std::string."]],code:'#include <iostream>\n#include <string>\n\nint main() {\n    int score = 120;\n    double accuracy = 98.5;\n    bool completed = true;\n    std::string player = "Alex";\n\n    std::cout << player << ": " << score;\n}',tip:"Use auto when the type is obvious from the initializer, but do not sacrifice readability.",quiz:{q:"Which type is best suited for true or false values?",opts:["int","bool","char"],a:1,why:"bool represents the logical values true and false."}},
{title:"Operators & Expressions",time:"10 min",desc:"Perform calculations, compare values and combine conditions.",sections:[["Arithmetic","C++ supports +, -, *, / and %. Integer division discards the fractional part. The remainder operator % works with integral operands."],["Comparisons and logic","Use ==, !=, <, >, <= and >= to compare. Combine conditions with && (and), || (or) and ! (not)."]],code:'int total = 17 + 5;\nint remainder = 17 % 5;\nbool isReady = total >= 20 && remainder == 2;',tip:"Use parentheses when an expression could be hard to read. Clear code beats clever code.",quiz:{q:"What is the value of 17 % 5?",opts:["2","3","3.4"],a:0,why:"17 divided by 5 leaves a remainder of 2."}},
{title:"Conditions: if, else & switch",time:"12 min",desc:"Make decisions in your programs.",sections:[["if and else","An if statement runs a block when its condition is true. Add else to handle the alternative. Use else if for multiple branches."],["switch","switch is useful when comparing one expression against several constant case values. Remember break to avoid falling through when that is not intended."]],code:'int temperature = 24;\n\nif (temperature > 30) {\n    std::cout << "Hot";\n} else if (temperature >= 18) {\n    std::cout << "Comfortable";\n} else {\n    std::cout << "Cold";\n}',tip:"Keep conditions readable. If a condition becomes complicated, extract part of it into a named bool variable.",quiz:{q:"Which keyword handles the alternative branch of an if statement?",opts:["otherwise","else","default"],a:1,why:"else runs when the preceding if condition is false."}},
{title:"Loops: for, while & do-while",time:"14 min",desc:"Repeat work efficiently with loops.",sections:[["for loops","A for loop groups initialization, condition and update in one place. It is useful when the number of iterations is known."],["while loops","A while loop repeats as long as its condition remains true. Make sure something inside the loop can eventually make the condition false."]],code:'for (int i = 1; i <= 5; ++i) {\n    std::cout << i << "\\n";\n}\n\nint countdown = 3;\nwhile (countdown > 0) {\n    std::cout << countdown << "\\n";\n    --countdown;\n}',tip:"Watch for off-by-one errors. Check the first and last iteration when debugging a loop.",quiz:{q:"Which loop checks its condition before each iteration?",opts:["while","do-while only","Neither"],a:0,why:"A while loop tests its condition before executing the body."}},
{title:"Functions",time:"14 min",desc:"Organize programs into reusable, focused pieces.",sections:[["Define and call","A function has a return type, a name, parameters and a body. Call it by using its name followed by parentheses."],["Parameters and return values","Parameters receive input. A non-void function returns a result with return. Use void when no value is returned."]],code:'int add(int a, int b) {\n    return a + b;\n}\n\nint main() {\n    int result = add(7, 5);\n    std::cout << result;\n}',tip:"Give functions one clear responsibility and choose names that explain what they do.",quiz:{q:"What does a function's return type describe?",opts:["Its file name","The type of value it returns","How many times it runs"],a:1,why:"The return type specifies the type of result produced by the function."}},
{title:"Arrays, Vectors & Strings",time:"16 min",desc:"Work with collections of values and text.",sections:[["Arrays","A built-in array stores a fixed number of elements of the same type. Its indices start at zero, so the final valid index is size minus one."],["std::vector and std::string","std::vector is a resizable sequence container. std::string represents text. Both are standard library types and should usually be preferred over manually managed arrays and character buffers."]],code:'#include <vector>\n#include <string>\n\nstd::vector<int> scores{10, 20, 30};\nscores.push_back(40);\n\nstd::string title = "C++";\nfor (int score : scores) {\n    std::cout << score << " ";\n}',tip:"Prefer std::vector for a dynamically sized sequence. Use .at() when you want bounds checking.",quiz:{q:"Which container can grow as elements are added?",opts:["std::vector","A built-in fixed array","int"],a:0,why:"std::vector manages a dynamically resizable sequence."}},
{title:"References & Pointers",time:"18 min",desc:"Understand aliases, addresses, indirection and safe access.",sections:[["References","A reference is an alias for an existing object. It must be initialized when declared and cannot later be reseated to refer to another object."],["Pointers","A pointer stores an address. Use & to take an address and * to dereference a pointer. A pointer can be null, so check it before dereferencing when necessary."]],code:'int value = 42;\nint& reference = value;\nint* pointer = &value;\n\nreference = 50;\nstd::cout << *pointer; // 50',tip:"Do not dereference null or dangling pointers. Prefer references when an object must exist, and smart pointers for ownership.",quiz:{q:"What does the & operator do in int* p = &value;?",opts:["Multiplies value","Gets the address of value","Deletes value"],a:1,why:"In this context, unary & obtains the object's address."}},
{title:"Classes & Objects",time:"20 min",desc:"Model data and behavior using object-oriented programming.",sections:[["Classes","A class defines a type with data members and member functions. An object is an instance of that class."],["Access control and constructors","public members form the accessible interface; private members hide implementation details. A constructor initializes an object when it is created."]],code:'#include <string>\n\nclass Player {\npublic:\n    Player(std::string name) : name_(name) {}\n    void greet() const {\n        std::cout << "Hi, " << name_;\n    }\nprivate:\n    std::string name_;\n};',tip:"Keep data private by default and expose a small, intentional public interface.",quiz:{q:"Which access specifier hides class members from ordinary outside access?",opts:["public","private","open"],a:1,why:"private members are accessible to the class itself and its friends, not ordinary callers."}},
{title:"Files, Errors & Debugging",time:"15 min",desc:"Read and write files, handle errors and debug systematically.",sections:[["File streams","Use std::ifstream to read and std::ofstream to write files. Check whether a stream opened successfully before using it."],["Debugging","Read compiler errors from the first relevant message. Use a debugger to inspect variables and step through execution. Exceptions can report exceptional runtime failures."]],code:'#include <fstream>\n#include <iostream>\n\nint main() {\n    std::ofstream file("notes.txt");\n    if (!file) {\n        std::cerr << "Could not open file";\n        return 1;\n    }\n    file << "Learning C++";\n}',tip:"Compile with warnings enabled. Warnings often reveal bugs before they become runtime problems.",quiz:{q:"Which stream class is used to read from a file?",opts:["std::ofstream","std::ifstream","std::ostream"],a:1,why:"std::ifstream is the input file stream type."}}
],
advanced:[
{title:"Object-Oriented Design",time:"20 min",desc:"Use encapsulation, inheritance, polymorphism and composition thoughtfully.",sections:[["Encapsulation","Encapsulation keeps an object's invariants protected behind a clear public interface. Callers should not need to know how the class stores its data."],["Inheritance and composition","Inheritance models an is-a relationship and enables runtime polymorphism through virtual functions. Composition builds larger objects from smaller ones and is often the simpler choice."]],code:'class Shape {\npublic:\n    virtual double area() const = 0;\n    virtual ~Shape() = default;\n};\n\nclass Square : public Shape {\npublic:\n    explicit Square(double side) : side_(side) {}\n    double area() const override { return side_ * side_; }\nprivate:\n    double side_;\n};',tip:"Prefer composition over inheritance unless substitutability is genuinely part of the design.",quiz:{q:"What does override communicate?",opts:["This function overrides a virtual base function","The function is private","The function runs only once"],a:0,why:"override asks the compiler to verify that a virtual base-class function is being overridden."}},
{title:"RAII & Smart Pointers",time:"22 min",desc:"Manage resources safely with deterministic lifetime and ownership.",sections:[["RAII","Resource Acquisition Is Initialization ties a resource's lifetime to an object's lifetime. Destructors release resources automatically when objects leave scope."],["Smart pointers","std::unique_ptr expresses exclusive ownership. std::shared_ptr expresses shared ownership and uses reference counting. Use std::weak_ptr to observe shared objects without extending their lifetime."]],code:'#include <memory>\n\nauto player = std::make_unique<Player>("Nova");\n// player owns the object exclusively.\n\n// Ownership can be transferred:\nauto next = std::move(player);',tip:"Prefer automatic objects and standard-library resource wrappers. Use raw pointers for non-owning access, not as an unclear ownership system.",quiz:{q:"Which smart pointer represents exclusive ownership?",opts:["std::shared_ptr","std::unique_ptr","std::weak_ptr"],a:1,why:"std::unique_ptr has sole ownership and cannot be copied."}},
{title:"Move Semantics & Value Categories",time:"22 min",desc:"Avoid unnecessary copies and understand move operations.",sections:[["Lvalues and rvalues","An lvalue identifies an object with a persistent identity. An rvalue is commonly a temporary value that can be moved from."],["Move operations","Move constructors and move assignment can transfer resources instead of duplicating them. std::move is a cast that enables move-aware overload resolution; it does not move by itself."]],code:'#include <string>\n#include <utility>\n\nstd::string source = "large text";\nstd::string destination = std::move(source);\n// destination now owns the transferred value.\n// source remains valid but its value is unspecified.',tip:"After moving from an object, use it only in ways allowed for a valid but unspecified state, such as assigning a new value.",quiz:{q:"Does std::move itself transfer resources?",opts:["Yes, always","No, it enables move-aware overload resolution","It deletes the object"],a:1,why:"std::move is essentially a cast to an rvalue reference; a move operation happens only if an appropriate operation is selected."}},
{title:"Templates & Generic Programming",time:"24 min",desc:"Write reusable code that works with many types.",sections:[["Function templates","A function template describes a family of functions. The compiler can deduce template arguments from the call."],["Class templates and constraints","Class templates parameterize types and values. Concepts (C++20) can constrain template parameters and make requirements clearer."]],code:'template <typename T>\nT maximum(T a, T b) {\n    return (a < b) ? b : a;\n}\n\n// C++20 concept\n#include <concepts>\ntemplate <std::totally_ordered T>\nT clampHigh(T value, T limit) {\n    return value < limit ? value : limit;\n}',tip:"Use concepts to express template requirements explicitly in C++20 and later.",quiz:{q:"What is a template used for?",opts:["Generating code for different types or values","Replacing all functions","Managing threads"],a:0,why:"Templates support generic programming by parameterizing functions and classes."}},
{title:"The Standard Template Library",time:"25 min",desc:"Choose containers, iterators and algorithms from the C++ standard library.",sections:[["Containers","std::vector, std::array, std::map, std::unordered_map, std::set and std::deque each solve different storage and lookup problems."],["Algorithms and iterators","The standard algorithms operate on iterator ranges. Prefer std::sort, std::find, std::transform and related tools over handwritten loops when they express the intent clearly."]],code:'#include <algorithm>\n#include <vector>\n\nstd::vector<int> values{8, 2, 5, 1};\nstd::sort(values.begin(), values.end());\nauto found = std::find(values.begin(), values.end(), 5);\nbool containsFive = found != values.end();',tip:"Know the complexity guarantees of the containers and algorithms you choose.",quiz:{q:"Which algorithm sorts a range?",opts:["std::find","std::sort","std::count_if"],a:1,why:"std::sort orders the elements in the supplied iterator range."}},
{title:"Lambdas & Functional Techniques",time:"18 min",desc:"Create concise callable objects and work with algorithms.",sections:[["Lambda expressions","A lambda creates an unnamed function object. It can capture variables from its surrounding scope by value or by reference."],["Captures and lifetime","A reference capture refers to the original object. Do not let a lambda outlive objects it references. Keep captures explicit and minimal."]],code:'#include <algorithm>\n#include <vector>\n\nstd::vector<int> numbers{1, 2, 3, 4, 5};\nint factor = 3;\nstd::transform(numbers.begin(), numbers.end(),\n    numbers.begin(), [factor](int n) { return n * factor; });',tip:"Prefer explicit capture lists. Be especially careful when storing callbacks that capture local variables by reference.",quiz:{q:"What does [factor] capture?",opts:["factor by reference","factor by value","Every variable"],a:1,why:"A variable listed without & in the capture list is captured by value."}},
{title:"Error Handling & Exceptions",time:"18 min",desc:"Design clear failure paths and use exceptions appropriately.",sections:[["Throw and catch","Throw an exception when an operation cannot fulfill its contract. Catch by const reference to avoid slicing and unnecessary copies."],["Exception safety","Aim for the strong guarantee when practical: an operation either succeeds or leaves the program state unchanged. RAII ensures resources are released during stack unwinding."]],code:'try {\n    performOperation();\n} catch (const std::runtime_error& error) {\n    std::cerr << "Operation failed: " << error.what();\n}',tip:"Do not use exceptions for ordinary control flow. Document which operations may throw.",quiz:{q:"Why are exceptions commonly caught by const reference?",opts:["To avoid slicing and copying","To make them global","Because values cannot be caught"],a:0,why:"Catching by const reference preserves the dynamic type and avoids copying the exception."}},
{title:"Concurrency & Multithreading",time:"26 min",desc:"Run tasks concurrently and protect shared data.",sections:[["Threads","std::thread starts a new thread of execution. Join a thread before its lifetime ends, or use std::jthread (C++20) for safer automatic joining."],["Synchronization","A data race is undefined behavior. Use mutexes and lock guards to protect shared mutable state. Atomics are useful for specific lock-free or low-level synchronization needs."]],code:'#include <thread>\n#include <iostream>\n\nvoid work() { std::cout << "Working\\n"; }\n\nint main() {\n    std::jthread worker(work); // C++20\n}',tip:"Concurrency bugs are difficult to reproduce. Minimize shared mutable state and use the highest-level synchronization tool that fits.",quiz:{q:"What does std::jthread do when its destructor runs?",opts:["Automatically joins if joinable","Always detaches","Terminates the program"],a:0,why:"std::jthread requests stop and joins its thread during destruction when joinable."}},
{title:"Data Structures & Algorithms",time:"28 min",desc:"Analyze complexity and select suitable data structures.",sections:[["Complexity","Big O describes how resource use grows with input size. O(1), O(log n), O(n), O(n log n) and O(n²) describe common growth rates."],["Choosing structures","Use a vector for fast indexed access and cache-friendly iteration, a map for ordered key lookup, and an unordered_map for average constant-time hash lookup. Consider memory and worst-case behavior too."]],code:'// Linear search: O(n)\nint findIndex(const std::vector<int>& data, int target) {\n    for (int i = 0; i < static_cast<int>(data.size()); ++i) {\n        if (data[i] == target) return i;\n    }\n    return -1;\n}',tip:"Measure real workloads before optimizing. Complexity is important, but constant factors and memory layout matter too.",quiz:{q:"What is the time complexity of binary search on a sorted array?",opts:["O(n)","O(log n)","O(n²)"],a:1,why:"Each step halves the remaining search interval."}},
{title:"Modern C++: C++17, C++20 & C++23",time:"25 min",desc:"Explore language and library features from recent C++ standards.",sections:[["C++17","Structured bindings, if constexpr, std::optional, std::variant and std::filesystem are useful additions."],["C++20 and C++23","C++20 adds concepts, ranges, coroutines and modules. C++23 adds features such as std::expected and improved ranges support. Compiler support varies, so check your toolchain."]],code:'// C++17 structured bindings\nstd::pair<int, std::string> entry{7, "Nova"};\nauto [id, name] = entry;\n\n// C++20 concepts\ntemplate <std::integral T>\nT doubleValue(T value) { return value * 2; }',tip:"Learn the standard version your project targets. Do not assume every compiler supports every recent feature.",quiz:{q:"Which standard introduced concepts?",opts:["C++11","C++17","C++20"],a:2,why:"Concepts became part of the C++20 standard."}},
{title:"Build Systems, Testing & Tooling",time:"22 min",desc:"Structure real projects and build reliable software.",sections:[["Build systems","CMake describes how to configure and build projects across platforms. Keep source files, headers, tests and assets organized."],["Testing and tooling","Write unit tests for important behavior. Use compiler warnings, sanitizers, formatters and static analysis. A repeatable build is part of a maintainable project."]],code:'cmake_minimum_required(VERSION 3.20)\nproject(MyApp LANGUAGES CXX)\n\nadd_executable(my_app\n    src/main.cpp\n    src/player.cpp\n)\ntarget_compile_features(my_app PRIVATE cxx_std_20)',tip:"Use version control and automated builds early. Small, repeatable steps make debugging easier.",quiz:{q:"What is CMake primarily used for?",opts:["Managing project configuration and builds","Replacing the C++ compiler","Editing images"],a:0,why:"CMake generates native build-system files from a portable project description."}}
]};
const state=JSON.parse(localStorage.getItem('learncpp-progress')||'{"done":[],"quiz":{},"xp":0}');
const all=()=>Object.entries(lessons).flatMap(([course,items])=>items.map((l,i)=>({course,index:i,...l})));
const total=all().length;
const save=()=>{localStorage.setItem('learncpp-progress',JSON.stringify(state));updateProgress()};
const updateProgress=()=>{const n=state.done.length,p=Math.round(n/total*100);document.getElementById('side-percent').textContent=p+'%';document.getElementById('side-count').textContent=n+' / '+total+' lessons';document.getElementById('side-fill').style.width=p+'%'};
const content=document.getElementById('content');
let current={view:'home'};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function navActive(view,course){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view||b.dataset.course===course));}
function home(){current={view:'home'};navActive('home');document.getElementById('breadcrumb').textContent='Learning / Dashboard';const done=state.done.length,p=Math.round(done/total*100);content.innerHTML=`
<section class="hero"><div><div class="eyebrow">THE C++ LEARNING PATH</div><h1>Write code.<br><span class="gradient">Think deeper.</span></h1><p>Learn C++ step by step, from your first program to advanced techniques used in real-world software. Pick your path and start building.</p><button class="btn primary" onclick="openCourse('basic')">Start learning →</button></div><div class="hero-card"><div class="eyebrow">A TINY FIRST STEP</div><pre class="code-mini"><span class="kw">#include</span> &lt;iostream&gt;

<span class="kw">int</span> <span class="fn">main</span>() {
  std::cout &lt;&lt; <span class="str">"Hello, C++!"</span>;
  <span class="kw">return</span> 0;
}</pre><div style="color:#9fb2d0;font-size:11px;margin-top:10px">Your journey starts with one program.</div></div></section>
<div class="stats"><div class="stat"><strong>${done}<span style="font-size:13px"> / ${total}</span></strong><span>Lessons completed</span></div><div class="stat"><strong>${state.xp}</strong><span>Experience points</span></div><div class="stat"><strong>${p}%</strong><span>Overall progress</span></div></div>
<div class="section-head"><div><h2>Choose your learning path</h2><p>Two courses. One language. Your pace.</p></div></div>
<div class="course-grid"><article class="course-card basic"><div class="course-icon">⌘</div><span class="pill">Beginner · Start here</span><h3>Basic Course</h3><p>Build a strong foundation in C++. Learn syntax, variables, control flow, functions, data structures and object-oriented programming.</p><div class="course-meta"><span>◷ ${lessons.basic.length} lessons</span><span>◎ Beginner friendly</span></div><button class="btn primary" onclick="openCourse('basic')">Explore basic course →</button></article>
<article class="course-card advanced"><div class="course-icon">⟡</div><span class="pill">Advanced · Level up</span><h3>Advanced Course</h3><p>Go beyond the basics with templates, the STL, memory management, concurrency, modern C++ and software engineering practices.</p><div class="course-meta"><span>◷ ${lessons.advanced.length} lessons</span><span>◎ Prior C++ knowledge</span></div><button class="btn" onclick="openCourse('advanced')">Explore advanced course →</button></article></div>
<div class="section-head"><div><h2>Continue learning</h2><p>Pick up where you left off.</p></div></div>
${done?'<button class="btn ghost" onclick="resume()">Continue your next lesson →</button>':'<div class="empty">No lessons completed yet. Open the Basic Course to begin!</div>'}`;updateProgress()}
function openCourse(course,index=0){current={view:'course',course,index};navActive(null,course);renderLesson()}
function renderLesson(){const {course,index}=current,items=lessons[course],l=items[index],done=state.done.includes(course+':'+index);document.getElementById('breadcrumb').textContent='Learning / '+(course==='basic'?'Basic Course':'Advanced Course');content.innerHTML=`<div class="lesson-layout"><aside class="lesson-list"><h3>${course==='basic'?'Basic Course':'Advanced Course'}</h3>${items.map((x,i)=>`<button class="lesson-link ${i===index?'active':''}" onclick="openCourse('${course}',${i})"><span>${state.done.includes(course+':'+i)?'<span class="done">✓</span>':'○'}</span><span>${i+1}. ${escapeHtml(x.title)}</span></button>`).join('')}</aside><article class="lesson-article"><div class="eyebrow">${course==='basic'?'BASIC COURSE':'ADVANCED COURSE'} · LESSON ${index+1} OF ${items.length}</div><h1>${escapeHtml(l.title)}</h1><p>${escapeHtml(l.desc)}</p><div class="course-meta"><span>◷ ${l.time}</span><span>◎ ${done?'Completed':'In progress'}</span></div>
${l.sections.map(([h,p])=>`<h2>${escapeHtml(h)}</h2><p>${escapeHtml(p)}</p>`).join('')}
<h2>Code example</h2><pre><code>${escapeHtml(l.code)}</code></pre><div class="callout"><b>💡 Pro tip</b><br>${escapeHtml(l.tip)}</div>
<div class="exercise"><h3>Quick knowledge check</h3><p>${escapeHtml(l.quiz.q)}</p><div id="quiz-options">${l.quiz.opts.map((o,i)=>`<label class="quiz-option"><input type="radio" name="answer" value="${i}"> ${escapeHtml(o)}</label>`).join('')}</div><button class="btn small" onclick="checkQuiz()">Check answer</button><div class="feedback" id="quiz-feedback"></div></div>
<div class="lesson-footer"><button class="btn ghost" ${index===0?'disabled':''} onclick="openCourse('${course}',${Math.max(0,index-1)})">← Previous</button><button class="btn primary" onclick="completeLesson()">${done?'Completed ✓':'Mark as complete'} ${index===items.length-1?'':'and continue →'}</button></div></article></div>`;const saved=state.quiz[course+':'+index];if(saved!==undefined){const f=document.getElementById('quiz-feedback');f.textContent=saved?'Correct! '+l.quiz.why:'Try again — review the lesson and give it another shot.';f.style.color=saved?'var(--green)':'var(--orange)'}}
function checkQuiz(){const {course,index}=current,l=lessons[course][index],selected=document.querySelector('input[name="answer"]:checked'),f=document.getElementById('quiz-feedback');if(!selected){f.textContent='Choose an answer first.';return}const correct=Number(selected.value)===l.quiz.a;state.quiz[course+':'+index]=correct;if(correct&&!state.done.includes(course+':'+index))state.xp+=10;save();f.textContent=correct?'Correct! '+l.quiz.why:'Not quite. Review the explanation and try again.';f.style.color=correct?'var(--green)':'var(--orange)'}
function completeLesson(){const {course,index}=current,key=course+':'+index;if(!state.done.includes(key)){state.done.push(key);state.xp+=25;save()}if(index+1<lessons[course].length)openCourse(course,index+1);else{renderLesson();}}
function resume(){const next=all().find(x=>!state.done.includes(x.course+':'+x.index));if(next)openCourse(next.course,next.index);else openProgress()}
function openProgress(){current={view:'progress'};navActive('progress');document.getElementById('breadcrumb').textContent='Your space / My Progress';const n=state.done.length,p=Math.round(n/total*100);content.innerHTML=`<div class="eyebrow">YOUR LEARNING JOURNEY</div><h1 style="font-size:36px;margin:8px 0">My Progress</h1><p style="color:var(--muted)">Every completed lesson is a step forward.</p><div class="stats"><div class="stat"><strong>${p}%</strong><span>Overall completion</span></div><div class="stat"><strong>${n}</strong><span>Lessons completed</span></div><div class="stat"><strong>${state.xp}</strong><span>XP earned</span></div></div><div class="course-card"><div style="display:flex;justify-content:space-between"><b>All courses</b><b>${n} / ${total}</b></div><div class="progress-track" style="height:10px"><div class="progress-fill" style="width:${p}%"></div></div><p>Complete lessons and pass knowledge checks to earn experience points.</p></div>${Object.entries(lessons).map(([c,items])=>`<div class="section-head"><div><h2>${c==='basic'?'Basic Course':'Advanced Course'}</h2><p>${items.filter((_,i)=>state.done.includes(c+':'+i)).length} of ${items.length} completed</p></div></div><div class="course-card">${items.map((l,i)=>`<button class="lesson-link" style="display:inline-flex;width:100%" onclick="openCourse('${c}',${i})"><span>${state.done.includes(c+':'+i)?'<span class="done">✓</span>':'○'}</span>${escapeHtml(l.title)}<span class="count" style="margin-left:auto">${state.done.includes(c+':'+i)?'Done':'Open lesson'}</span></button>`).join('')}</div>`).join('')}<div style="margin-top:22px"><button class="btn ghost" onclick="if(confirm('Reset all learning progress?')){state.done=[];state.quiz={};state.xp=0;save();openProgress()}">Reset progress</button></div>`;}
function openPractice(){current={view:'practice'};navActive('practice');document.getElementById('breadcrumb').textContent='Your space / Practice';const qs=all().filter(x=>x.quiz);const sample=[qs[2],qs[7],qs[10],qs[13],qs[17]].filter(Boolean);content.innerHTML=`<div class="eyebrow">TEST YOUR KNOWLEDGE</div><h1 style="font-size:36px;margin:8px 0">Practice & Quizzes</h1><p style="color:var(--muted)">Short checks help you remember what you learn. Open a lesson to take its knowledge check.</p><div class="course-grid">${sample.map(x=>`<div class="course-card"><span class="pill" style="--accent:${x.course==='basic'?'var(--cyan)':'var(--purple)'}">${x.course==='basic'?'Basic':'Advanced'}</span><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.quiz.q)}</p><button class="btn small" onclick="openCourse('${x.course}',${x.index})">Open quiz →</button></div>`).join('')}</div><div class="callout">Tip: Try answering before looking at the explanation. Revisit lessons whenever you need a refresher.</div>`;}
function searchLessons(q){const box=document.getElementById('search-results');if(!q.trim()){box.classList.add('hidden');return}const matches=all().filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q.toLowerCase())).slice(0,7);box.innerHTML=matches.length?matches.map(x=>`<button class="search-result" onclick="openCourse('${x.course}',${x.index});document.getElementById('search-results').classList.add('hidden')">${escapeHtml(x.title)} <small style="color:#8fa2bf">· ${x.course}</small></button>`).join(''):'<div style="padding:10px;color:#9aabc5">No lessons found.</div>';box.classList.remove('hidden')}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');b.dataset.view==='home'?home():b.dataset.view==='progress'?openProgress():openPractice()}));
document.querySelectorAll('[data-course]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');openCourse(b.dataset.course)}));
document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('search').addEventListener('input',e=>searchLessons(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('.top-actions'))document.getElementById('search-results').classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('search').focus()}if(e.key==='Escape'){document.getElementById('search-results').classList.add('hidden');document.getElementById('sidebar').classList.remove('open')}});
home();
</script>
</body></html>
